name: CI - Lint and Test

on:
  push:
    branches:
      - main
      - ci-test
  pull_request:
    branches:
      - main
      - ci-test
  workflow_dispatch:
  workflow_call:

jobs:
  lint-and-format:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: webview/.nvmrc
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: Setup Python Env
        uses: ./.github/actions/setup-python-env
        with:
          uv-extra-groups: ci
      - name: Install frontend dependencies
        run: npm ci --prefix webview
      - name: Check frontend quality
        run: |
          npm --prefix webview run typecheck
          npm --prefix webview run lint
          npm --prefix webview run format:check
          npm --prefix webview test
          npm --prefix webview run build
      - name: Check formatting
        run: |
          source .venv/bin/activate
          ruff format . --check
      - name: Run lint checks
        run: |
          source .venv/bin/activate
          ruff check .

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: webview/.nvmrc
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: Setup Python Env
        uses: ./.github/actions/setup-python-env
        with:
          uv-extra-groups: ci
      - name: Install frontend dependencies
        run: npm ci --prefix webview
      - name: Build frontend assets
        run: npm --prefix webview run build
      - name: Install browser for end-to-end tests
        run: npm --prefix webview run playwright:install
      - name: Run browser tests
        run: npm --prefix webview run test:e2e
      - name: Build Python distributions
        run: uv build
      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest
