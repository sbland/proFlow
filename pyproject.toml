[project]
name = "proflow"
version = "0.6.5"
description = "Functional micro pipeline manager"
authors = [{ "name" = "Sam Bland" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "data-helpers-v2>=0.2.1",
  "dill>=0.4.1",
  "numpy>=1.18.3",
]
[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-snapshot>=0.9.0",
  "ruff>=0.7.0",
  "pre-commit>=2.7.1",
  "bump2version>=1.0.1",
  "pytest-benchmark>=3.4.1",
  "decorator>=5.0.0",
]

test = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-benchmark>=3.4.1",
  "pytest-snapshot>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["experiments"]

[tool.ruff.lint.per-file-ignores]
"_test.py" = ["D100", "D101", "D102", "D103", "D107"]
"test_*.py" = ["D100", "D101", "D102", "D103", "D107"]

