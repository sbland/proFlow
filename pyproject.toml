[project]
name = "proflow"
version = "0.7.1"
description = "Functional micro pipeline manager"
authors = [{ "name" = "Sam Bland" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "data-helpers-v2>=0.2.1",
    "dill>=0.4.1",
    "numpy>=1.18.3",
]
[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-snapshot>=0.9.0",
  "ruff>=0.17.0",
  "pre-commit>=2.7.1",
  "bump2version>=1.0.1",
  "pytest-benchmark>=3.4.1",
  "decorator>=5.0.0",
]

test = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-benchmark>=3.4.1",
  "pytest-snapshot>=0.9.0",
]

ci = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-snapshot>=0.9.0",
  "ruff>=0.17.0",
  "pytest-benchmark>=3.4.1",
  "decorator>=5.0.0",
]

web = [
  "flask>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["experiments"]

[tool.ruff.lint]
ignore = [
  "F403", # We sometimes use wildcard imports
  "E731", # We use lambda functions a lot in this project
  "E742", # We use some ambiguous variable names intentionally
]

[tool.ruff.lint.per-file-ignores]
"_test.py" = ["D100", "D101", "D102", "D103", "D107"]
"test_*.py" = ["D100", "D101", "D102", "D103", "D107"]
