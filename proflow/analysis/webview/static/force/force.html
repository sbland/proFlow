<!DOCTYPE html>
<html>
  <head>
    <title>Proflow Process Runner Network Analysis</title>
    <script type="text/javascript" src="https://d3js.org/d3.v4.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-color.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-dispatch.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-ease.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-interpolate.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-selection.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-timer.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-transition.v1.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3-selection-multi.v1.min.js"></script>
    <link type="text/css" rel="stylesheet" href="force/force.css"/>
  </head>
  <body>
    <aside class="control-panel" aria-labelledby="control-panel-title">
      <h1 id="control-panel-title">Node filter</h1>
      <label for="node-filter">Search nodes</label>
      <input
        id="node-filter"
        type="search"
        placeholder="Search by name, description, or ID"
        autocomplete="off"
      />
      <fieldset class="node-style-options">
        <legend>Node shape</legend>
        <label>
          <input id="node-shape-box" type="radio" name="node-shape" value="box" checked />
          Box
        </label>
        <label>
          <input id="node-shape-dot" type="radio" name="node-shape" value="dot" />
          Dot
        </label>
      </fieldset>
      <p id="filter-summary" aria-live="polite">Loading nodes...</p>
    </aside>
    <svg width="1280" height="1080" role="img" aria-label="Process network graph"></svg>
    <script type="text/javascript" src="force/force.js"></script>
  </body>
</html>
